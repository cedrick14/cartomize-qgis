name: Cartomize Python library
on:
  push:
    paths: ['python-library/**', '.github/workflows/python-library.yml']
  pull_request:
    paths: ['python-library/**', '.github/workflows/python-library.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: python-library
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,gui]"
      - run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m build
      - run: python -m twine check dist/*
