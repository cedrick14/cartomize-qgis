name: Build Cartomize ArcGIS Pro 10.5.1

on:
  push:
    branches:
      - arcgispro-build-10.5.1.3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check numpy

      - name: Validate QGIS 10.5.1 parity
        working-directory: arcgis-build/source
        run: python scripts/validate.py

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build with Visual Studio MSBuild
        shell: pwsh
        working-directory: arcgis-build/source
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" |
            Select-Object -First 1
          if (-not $msbuild) { throw "Visual Studio MSBuild.exe not found" }
          Write-Host "Using MSBuild: $msbuild"
          & $msbuild .\Cartomize.ArcGISPro.sln /restore /p:RestoreConfigFile="$PWD\NuGet.Config" /p:Configuration=Release /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $msbuild .\Cartomize.ArcGISPro.sln /t:Build /p:Configuration=Release /p:RestorePackages=false /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect compiled outputs
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "arcgis-build\source"
          $project = Join-Path $source "src\Cartomize.ArcGISPro"
          $output = Join-Path $env:GITHUB_WORKSPACE "arcgis-build\output"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $dll = Get-ChildItem $project -Recurse -Filter "Cartomize.ArcGISPro.dll" |
            Where-Object { $_.FullName -match "\\bin\\Release\\" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $dll) { throw "Cartomize.ArcGISPro.dll not found" }
          Copy-Item $dll.FullName (Join-Path $output "Cartomize.ArcGISPro.dll")
          $addin = Get-ChildItem $project -Recurse -Filter "*.esriAddInX" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $addin) { throw "Cartomize ArcGIS Pro .esriAddInX not found" }
          Copy-Item $addin.FullName (Join-Path $output "Cartomize-ArcGISPro-10.5.1.esriAddInX")
          $sourceStage = Join-Path $env:RUNNER_TEMP "cartomize-arcgis-pro-source-10.5.1"
          if (Test-Path $sourceStage) { Remove-Item $sourceStage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $sourceStage | Out-Null
          & robocopy $source $sourceStage /E /XD .vs bin obj __pycache__ release CARTOMIZE /XF *.pyc *.csproj.user *.esriAddInX *.pdb *.dll
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          $global:LASTEXITCODE = 0
          Compress-Archive -Path (Join-Path $sourceStage "*") -DestinationPath (Join-Path $output "cartomize-arcgis-pro-source-10.5.1.zip") -Force
          Get-ChildItem $output | Format-Table Name,Length

      - name: Upload compiled artifact
        uses: actions/upload-artifact@v4
        with:
          name: cartomize-arcgispro-10.5.1-complet
          path: arcgis-build/output/*
          if-no-files-found: error
