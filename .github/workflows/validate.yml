name: Validate Cartomize

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate source and metadata
        run: python tools/validate_release.py

      - name: Run regression tests
        run: python -m unittest discover -s cartomize_qgis/tests -v

      - name: Build installable QGIS ZIP
        run: python tools/build_plugin_zip.py --output dist/Cartomize-10.5.1.zip

      - name: Upload validated plugin package
        uses: actions/upload-artifact@v4
        with:
          name: Cartomize-10.5.1-QGIS
          path: dist/Cartomize-10.5.1.zip
          if-no-files-found: error
