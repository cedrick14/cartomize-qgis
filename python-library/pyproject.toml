[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cartomize"
version = "0.1.0a1"
description = "Cartographic layouts, raster analysis and GeoPandas workflows derived from Cartomize ArcGIS Pro"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "ONDON NKOUA Cédrick Belmich"}]
keywords = ["cartography", "gis", "geopandas", "raster", "map-layout"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = ["geopandas>=1.0,<2", "matplotlib>=3.8,<4", "numpy>=1.26,<3", "pyproj>=3.6,<4", "rasterio>=1.4,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "twine>=6,<8"]

[project.urls]
Homepage = "https://cartomizeplugin.com"
Repository = "https://github.com/cedrick14/cartomize-qgis"
Issues = "https://github.com/cedrick14/cartomize-qgis/issues"

[project.scripts]
cartomize = "cartomize.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cartomize = ["py.typed", "templates_library/*.json", "templates_library/*.txt", "templates_library/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
